# Resume Studio's compile service: TeX Live, latexmk, SyncTeX and poppler in a container, so the app
# builds resumes the same way on macOS, Linux and Windows without installing TeX.
#
#   docker compose up -d        start it (the first build downloads TeX Live, a few GB)
#   pnpm dev                    run the app; it uses the service when TeX isn't installed here
#
# Optional: the tailoring engine as a standalone HTTP service (for use outside the app, with API keys):
#   TAILOR_API_KEY=… ANTHROPIC_API_KEY=… docker compose --profile engine up -d

name: resume-studio

services:
  tex:
    build:
      context: .
      dockerfile: packages/tex-service/Dockerfile
    image: resume-studio-tex:latest
    # Loopback only: the service runs TeX on whatever it's sent, so only this machine may reach it.
    ports:
      - "127.0.0.1:${TEX_SERVICE_PORT:-4380}:4380"
    environment:
      TEX_SERVICE_TOKEN: ${TEX_SERVICE_TOKEN:-}
      TEX_SERVICE_CONCURRENCY: ${TEX_SERVICE_CONCURRENCY:-}
    volumes:
      - tex-data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Reaps the processes TeX starts (latexmk → xelatex → biber) and passes signals on.
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  engine:
    profiles: [engine]
    build:
      context: .
      dockerfile: packages/tailor-server/Dockerfile
    image: resume-studio-tailor:latest
    ports:
      - "127.0.0.1:${TAILOR_PORT:-8787}:8787"
    environment:
      TAILOR_API_KEY: ${TAILOR_API_KEY:-}
      TAILOR_PROVIDER: ${TAILOR_PROVIDER:-}
      TAILOR_MODEL: ${TAILOR_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-}
    volumes:
      - tailor-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  tex-data:
  tailor-data:
